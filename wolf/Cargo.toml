[package]
name = "wolf-toolkit"
version = "1.9.3"
edition = "2021"

[dependencies]
encoding_rs = "0.8"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
